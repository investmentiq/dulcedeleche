<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1530"><meta name="description" content="A calmer way to read Hacker News. Live stories, thoughtful conversations, and your own reading list."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Hacker News Reader — MGL Edition</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mgl.css"><style>
.reader-size{display:flex;align-items:center;gap:4px;flex-shrink:0}
.reader-size button{min-width:38px;min-height:34px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-size:13px}
.reader-size button:disabled{opacity:.4;cursor:default}
.reader-size output{min-width:42px;text-align:center;font-size:11px;font-variant-numeric:tabular-nums}
:root{--reader-scale:1}
.story-title{font-size:calc(16px * var(--reader-scale))}
.prose{font-size:calc(14px * var(--reader-scale))}
.meta,.domain{font-size:calc(10px * var(--reader-scale))}
.comment summary{font-size:calc(11px * var(--reader-scale))}
.detail h1{font-size:calc(27px * var(--reader-scale))}
@media(max-width:850px){.story-title{font-size:calc(14px * var(--reader-scale))}}
@media(max-width:600px){.prose{font-size:calc(13px * var(--reader-scale))}.detail h1{font-size:calc(23px * var(--reader-scale))}.labs-bar{gap:8px;flex-wrap:wrap}}
</style></head><body><div class="labs-bar"><a href="../../">← MartianGalactic Labs</a><div class="reader-size" role="group" aria-label="Reading text size"><button type="button" id="text-smaller" aria-label="Decrease text size" title="Smaller text">A−</button><output id="text-size" aria-live="polite" aria-label="Current text size">100%</output><button type="button" id="text-larger" aria-label="Increase text size" title="Larger text">A+</button><button type="button" id="text-reset" aria-label="Reset text size" title="Reset text size">Reset</button></div></div><header><a class="brand" href="#top"><b>Y</b><span>Hacker News<small>MARTIANGALACTIC LABS.</small></span></a><form id="search"><span aria-hidden="true">⌕</span><input aria-label="Search Hacker News" placeholder="Search stories, ideas, anything…" id="query"><kbd>/</kbd></form><button id="theme" class="icon" aria-label="Toggle dark mode">◐</button></header><div class="shell"><aside><div class="nav-label">YOUR DAILY DISCOVERY</div><nav id="nav"></nav><div class="aside-note"><span class="live-dot"></span> A live window into HN<p>Technology, ideas, and the people building what comes next.</p></div><a class="source-link" href="https://news.ycombinator.com" target="_blank" rel="noopener">Visit Hacker News ↗</a></aside><main id="main" tabindex="-1"></main></div><div id="toast" role="status"></div><script>
(()=>{const levels=[0.875,1,1.125,1.25,1.375,1.5,1.625,1.75];let scale=1;try{const stored=Number(localStorage.getItem('mgl-hn-text-size'));if(levels.includes(stored))scale=stored}catch{}
const smaller=document.getElementById('text-smaller'),larger=document.getElementById('text-larger'),reset=document.getElementById('text-reset'),output=document.getElementById('text-size');
function apply(){document.documentElement.style.setProperty('--reader-scale',scale);output.textContent=Math.round(scale*100)+'%';smaller.disabled=scale===levels[0];larger.disabled=scale===levels[levels.length-1];reset.disabled=scale===1;try{localStorage.setItem('mgl-hn-text-size',String(scale))}catch{}}
smaller.onclick=()=>{scale=levels[Math.max(0,levels.indexOf(scale)-1)];apply()};larger.onclick=()=>{scale=levels[Math.min(levels.length-1,levels.indexOf(scale)+1)];apply()};reset.onclick=()=>{scale=1;apply()};apply()})();
</script><script src="app.js"></script></body></html>
