name: Build Sözlük Okuru APK
on:
  push:
    branches:
      - build/sozluk-apk-v2-20260925
    paths:
      - .github/workflows/build-sozluk-apk.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore patched Android source
        run: |
          cat .apk-build/src.part*.b64 | base64 -d > /tmp/sozluk-src.zip
          unzip -q /tmp/sozluk-src.zip -d /tmp/sozluk
          test -f /tmp/sozluk/android-app/src/com/investilogiusa/sozlukokuru/MainActivity.java

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Compile and package APK
        shell: bash
        run: |
          set -euxo pipefail
          APP=/tmp/sozluk/android-app
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ANDROID_JAR="$SDK/platforms/android-34/android.jar"
          BT="$SDK/build-tools/34.0.0"
          cd "$APP"
          rm -rf build
          mkdir -p build/gen build/classes build/dex

          "$BT/aapt" package -f -m             -J build/gen             -M AndroidManifest.xml             -S res             -I "$ANDROID_JAR"             --min-sdk-version 21             --target-sdk-version 34

          javac -encoding UTF-8 -source 8 -target 8             -classpath "$ANDROID_JAR"             -d build/classes             build/gen/com/investilogiusa/sozlukokuru/R.java             src/com/investilogiusa/sozlukokuru/EksiClient.java             src/com/investilogiusa/sozlukokuru/MainActivity.java

          jar cf build/classes.jar -C build/classes .
          "$BT/d8" --min-api 21 --lib "$ANDROID_JAR"             --output build/dex build/classes.jar

          "$BT/aapt" package -f             -M AndroidManifest.xml             -S res             -I "$ANDROID_JAR"             -F build/unsigned.apk             --min-sdk-version 21             --target-sdk-version 34             --version-code 4             --version-name 1.4

          (cd build/dex && zip -q -j ../unsigned.apk classes.dex)
          "$BT/zipalign" -f 4 build/unsigned.apk build/aligned.apk

          keytool -genkeypair -v             -keystore build/debug.keystore             -storepass android -alias androiddebugkey -keypass android             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

          "$BT/apksigner" sign             --ks build/debug.keystore             --ks-pass pass:android             --key-pass pass:android             --out build/Sozluk-Okuru-v1.4-debug.apk             build/aligned.apk

          "$BT/apksigner" verify --verbose build/Sozluk-Okuru-v1.4-debug.apk
          "$BT/aapt" dump badging build/Sozluk-Okuru-v1.4-debug.apk | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sozluk-Okuru-v1.4-debug
          path: /tmp/sozluk/android-app/build/Sozluk-Okuru-v1.4-debug.apk
          if-no-files-found: error
          retention-days: 7
